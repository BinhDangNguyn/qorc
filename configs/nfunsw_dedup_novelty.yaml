# NF-UNSW-NB15-v2 zero-day protocol: train on normal (Benign) flows only, score
# held-out normal against EVERY attack category, all unseen. Deduplicated, so
# held-out normal flows are not copies of training flows.
#
#   python -m elements.run configs/nfunsw_dedup_novelty.yaml --plan

name: nfunsw_dedup_novelty
task: novelty
seed: 42

data:
  dataset: nf_unsw_nb15_v2
  dedup: true

split:
  test_size: 0.30
  val_frac: 0.10

encoding:
  scheme: tanh
  width: 3.0

arms: [quantum, dials, rff, raw]

grid:
  reservoirs:
    - {kind: iontrap, n_in: 4, n_mem: 4, steps: 8, dt: 0.3, topology: all_to_all}
    - {kind: iontrap, n_in: 4, n_mem: 4, steps: 8, dt: 0.3, topology: all_to_all, memory: false}
  heads:
    - {kind: pca, n_components: 32}
    - {kind: ae, hidden: [256], bottleneck: 32}

baseline_heads:
  - {kind: iforest, arms: [raw]}

device: auto
out: runs
